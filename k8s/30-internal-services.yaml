# Внутренние сервисы паттерна и защищаемое приложение (тип Service: ClusterIP)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sag-request-verifier
  namespace: sag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sag-request-verifier
  template:
    metadata:
      labels:
        app: sag-request-verifier
        sag/role: internal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: verifier
        image: sag/request-verifier:1.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet: &id001
            path: /healthz
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
          initialDelaySeconds: 10
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sag-redis
              key: password
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: sag-request-verifier
  namespace: sag
spec:
  type: ClusterIP
  selector:
    app: sag-request-verifier
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sag-auth
  namespace: sag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sag-auth
  template:
    metadata:
      labels:
        app: sag-auth
        sag/role: internal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: auth
        image: sag/auth:1.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet: &id001
            path: /healthz
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
