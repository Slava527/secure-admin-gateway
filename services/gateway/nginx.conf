# TLS-терминатор sag-gateway: TLS 1.3, обязательный клиентский сертификат (mTLS),
# ограничение частоты запросов. Работает в одном поде с приложением шлюза.
pid /tmp/nginx.pid;
events {}
http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    server_tokens off;

    # Защита от перегрузки административного интерфейса: администратору не нужно
    # больше 5 запросов в секунду и 10 одновременных соединений с одного адреса
    limit_req_zone  $binary_remote_addr zone=admin:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    # Защита от медленных атак (slowloris): соединение не удерживается бесконечно
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;

    server {
        listen 8443 ssl;
        ssl_protocols        TLSv1.3;
        ssl_certificate      /pki/server.crt;
        ssl_certificate_key  /pki/server.key;
        ssl_client_certificate /pki/ca.crt;   # доверенный корпоративный УЦ
        ssl_verify_client    on;              # клиентский сертификат обязателен
        ssl_verify_depth     2;

        # 495 - недействительный сертификат, 496 - сертификат не предъявлен:
        # соединение закрывается без ответа (444), данные приложения не передаются
        error_page 495 496 = @reject;
        location @reject { return 444; }

        location /admin/ {
            limit_req  zone=admin burst=10 nodelay;
            limit_req_status 429;
            limit_conn perip 10;
            limit_conn_status 429;
            client_max_body_size 1m;
            # заголовки перезаписываются, подделать их со стороны клиента нельзя
            proxy_set_header X-Client-Cert   $ssl_client_escaped_cert;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_pass http://127.0.0.1:8000;
        }
        location / { return 404; }
    }
}
